<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset=" UTF-8">
    <title th:text="${action == 'new' ? 'Agregar Factura' : 'Editar Factura'}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"
                th:text="${action == 'new' ? 'Agregar Nueva Factura' : 'Editar Factura'}">
                Agregar Nueva Factura
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/web/facturas}" th:object="${factura}" method="post">

                <input type="hidden" th:field="*{idFactura}" />
                <input type="hidden" th:field="*{cliente.idCliente}" />

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="montoTotal" class="form-label">Monto Total</label>
                        <input type="number" step="0.01" id="montoTotal" th:field="*{montoTotal}"
                               class="form-control" placeholder="0.00" required>
                    </div>
                </div>

                <!-- Botones -->
                <div class="mt-4 d-flex justify-content-between">

                    <a href="#"
                       onclick="history.back(); return false;"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-success"
                            th:text="${action == 'new' ? 'Guardar Factura' : 'Actualizar Factura'}">
                        Guardar Telefono
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>

</html>
