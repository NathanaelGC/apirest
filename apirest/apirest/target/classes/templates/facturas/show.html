<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Detalles de la Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">

            <div class="d-flex justify-content-between">
                <h3 class="mb-3" th:text="${factura.cliente.nombre + ' ' + factura.cliente.apellidoPaterno +
                    (factura.cliente.apellidoMaterno != null ? ' ' + factura.cliente.apellidoMaterno : '')}">
                    Factura del Cliente
                </h3>

                <a th:href="@{/web/facturas}" class="btn btn-secondary">← Volver</a>
            </div>

            <hr/>

            <div class="row g-3">
                <div class="col-md-6">
                    <p><strong>ID Factura:</strong>
                        <span th:text="${factura.idFactura}"></span>
                    </p>

                    <p><strong>ID Cliente:</strong>
                        <span th:text="${factura.cliente.idCliente}"></span>
                    </p>
                </div>

                <div class="col-md-6">
                    <p><strong>Monto Total:</strong>
                        <span th:text="${factura.montoTotal}"></span>
                    </p>
                </div>

            </div>
            <hr/>
        </div>
    </div>
</div>

</body>
</html>
