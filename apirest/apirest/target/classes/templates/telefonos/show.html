<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Detalles del Telefono</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">

            <div class="d-flex justify-content-between">
                <h3 class="mb-3" th:text="${telefono.cliente.nombre + ' ' + telefono.cliente.apellidoPaterno +
                    (telefono.cliente.apellidoMaterno != null ? ' ' + telefono.cliente.apellidoMaterno : '')}">
                    Telefono del Cliente
                </h3>

                <a th:href="@{/web/telefonos}" class="btn btn-secondary">← Volver</a>
            </div>

            <hr/>

            <div class="row g-3">
                <div class="col-md-6">
                    <p><strong>ID Telefono:</strong>
                        <span th:text="${telefono.idTelefono}"></span>
                    </p>

                    <p><strong>ID Cliente:</strong>
                        <span th:text="${telefono.cliente.idCliente}"></span>
                    </p>
                </div>

                <div class="col-md-6">
                    <p><strong>Telefono:</strong>
                        <span th:text="${telefono.telefono}"></span>
                    </p>
                </div>

            </div>
            <hr/>
        </div>
    </div>
</div>

</body>
</html>
