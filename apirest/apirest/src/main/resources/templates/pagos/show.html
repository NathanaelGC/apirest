<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Detalles del Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">

            <div class="d-flex justify-content-between">
                <h3 class="mb-3" th:text="${pago.factura.cliente.nombre + ' ' + pago.factura.cliente.apellidoPaterno +
                    (pago.factura.cliente.apellidoMaterno != null ? ' ' + pago.factura.cliente.apellidoMaterno : '')}">
                    Pago del Cliente
                </h3>

                <a th:href="@{/web/pagos}" class="btn btn-secondary">← Volver</a>
            </div>

            <hr/>

            <div class="row g-3">
                <div class="col-md-6">
                    <p><strong>ID Pago:</strong>
                        <span th:text="${pago.idPago}"></span>
                    </p>

                    <p><strong>ID Factura:</strong>
                        <span th:text="${pago.factura.idFactura}"></span>
                    </p>
                </div>

                <div class="col-md-6">
                    <p><strong>Monto:</strong>
                        <span th:text="${pago.monto}"></span>
                    </p>
                </div>

            </div>
            <hr/>
        </div>
    </div>
</div>

</body>
</html>
