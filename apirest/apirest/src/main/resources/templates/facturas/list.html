<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        .inactive {
            opacity: 0.6;
        }

        tbody tr:hover {
            background-color: #f0f8ff;
        }

        th {
            text-align: center;
        }

        .action-btn {
            margin-right: 4px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Lista de Facturas</h2>

    <div class="mb-3">
        <a th:href="@{/web/facturas}" class="btn btn-secondary">Todos</a>
        <a th:href="@{/web/facturas/activos}" class="btn btn-success">Activos</a>
        <a th:href="@{/web/facturas/inactivos}" class="btn btn-warning">Inactivos</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Id Cliente</th>
                <th>Id Factura</th>
                <th>Monto Total</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="factura : ${facturas}" th:classappend="${factura.activo == 0} ? 'inactive'">
                <td th:text="${factura.cliente.idCliente}"></td>
                <td th:text="${factura.idFactura}"></td>
                <td th:text="${#numbers.formatDecimal(factura.montoTotal, 1, 2, 'POINT')}"></td>
                <td class="text-center">
                    <span th:text="${factura.activo == 1 ? 'Si' : 'No'}"
                          th:class="${factura.activo == 0} ? 'text-danger fw-bold' : 'fw-bold'"></span>
                </td>
                <td class="text-center">
                    <a th:href="@{/web/facturas/{id}(id=${factura.idFactura})}" class="btn btn-info btn-sm action-btn">Ver</a>
                    <a th:href="@{/web/facturas/edit/{id}(id=${factura.idFactura})}" class="btn btn-primary btn-sm action-btn">Editar</a>
                    <a th:href="@{/web/pagos/new(idFactura=${factura.idFactura})}" class="btn btn-primary btn-sm action-btn">+Pago</a>
                    <a th:if="${factura.activo == 1}" th:href="@{/web/facturas/inactivar/{id}(id=${factura.idFactura})}"
                       class="btn btn-warning btn-sm action-btn">Inactivar</a>
                    <a th:if="${factura.activo == 0}" th:href="@{/web/facturas/activar/{id}(id=${factura.idFactura})}"
                       class="btn btn-success btn-sm action-btn">Activar</a>
                </td>
            </tr>
            </tbody>
        </table>
        <a th:href="@{/web/clientes}" class="btn btn-secondary">
            Clientes
        </a>
        <a th:href="@{/web/pagos}" class="btn btn-secondary">
            Pagos
        </a>
    </div>
</div>

</body>
</html>
